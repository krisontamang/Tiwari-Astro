      /* Interactive Payment Amount Badges */

      /* Cosmic AI Chatbot Floating Widget */
      .chat-corner-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999;
        background: linear-gradient(135deg, #1f1633, #120d20);
        border: 1px solid rgba(216, 176, 106, 0.4);
        color: #f4d38c;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(216, 176, 106, 0.2);
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .chat-corner-btn:hover {
        transform: translateY(-3px) scale(1.03);
        background: linear-gradient(135deg, #2b1f47, #19122c);
        border-color: #d8b06a;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 28px rgba(216, 176, 106, 0.35);
        color: #fff;
      }
      .chat-pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2ecc71;
        box-shadow: 0 0 10px #2ecc71;
        animation: chatPulseAnim 2s infinite;
      }
      @keyframes chatPulseAnim {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }

      /* Chat Window */
      .chat-modal-window {
        position: fixed;
        bottom: 78px;
        right: 20px;
        width: 360px;
        max-width: calc(100vw - 32px);
        height: 520px;
        max-height: calc(100vh - 100px);
        background: #120d22;
        border: 1px solid rgba(216, 176, 106, 0.35);
        border-radius: 1.25rem;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(216, 176, 106, 0.15);
        z-index: 9999;
        display: none;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(14px);
        animation: chatWindowPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes chatWindowPop {
        from { opacity: 0; transform: translateY(20px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .chat-window-header {
        background: linear-gradient(90deg, #18122c, #100b1d);
        border-bottom: 1px solid rgba(216, 176, 106, 0.2);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chat-header-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: radial-gradient(circle, #f4d38c, #a8794f);
        color: #160f22;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
      }
      .chat-window-close {
        background: transparent;
        border: none;
        color: #a395a8;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
        border-radius: 50%;
      }
      .chat-window-close:hover { color: #fff; }

      .chat-chips-scroll {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        overflow-x: auto;
        background: rgba(0,0,0,0.25);
        border-bottom: 1px solid rgba(255,255,255,0.04);

      }
      .chat-chips-scroll::-webkit-scrollbar { display: none; }
      .chat-chip {
        background: rgba(216, 176, 106, 0.1);
        border: 1px solid rgba(216, 176, 106, 0.25);
        color: #f4d38c;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.18s;
      }
      .chat-chip:hover {
        background: #d8b06a;
        color: #120e18;
      }

      .chat-messages-area {
        flex: 1;
        padding: 14px 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;

        max-width: 86%;

        border-radius: 1rem;

      .bot-bubble {
        background: #1c1530;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #f1ecf5;
        align-self: flex-start;
        border-bottom-left-radius: 0.25rem;
      }
      .user-bubble {
        background: linear-gradient(135deg, #d8b06a, #b88840);
        color: #120e18;
        font-weight: 600;
        align-self: flex-end;
        border-bottom-right-radius: 0.25rem;
      }
      .chat-input-row {
        padding: 10px;
        background: #17112b;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chat-input-field {
        flex: 1;
        background: #0d0918;
        border: 1px solid rgba(216, 176, 106, 0.25);
        border-radius: 999px;
        padding: 8px 14px;
        color: #fff;
        font-size: 12.5px;
        outline: none;
      }
      .chat-input-field:focus {
        border-color: #d8b06a;
      }
      .chat-send-action {
        width: 36px;

        background: linear-gradient(135deg, #d8b06a, #b88840);

        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
      }
      .chat-send-action:hover {
        transform: scale(1.05);
      }
    </style>

  <body>

    <!-- Quick Access Links -->

    <a href="/pay" class="pay-corner-link" title="Simple Payment System (Choose plan & Pay)">

    </a>

    <!-- Cosmic Astrology AI Chatbot Floating Trigger -->
    <button id="astro-chat-btn" class="chat-corner-btn" onclick="toggleAstroChat()" title="AI ज्योतिष सल्लाहकारसँग कुरा गर्नुहोस्">
      <span class="chat-pulse"></span>
      <span style="font-size: 16px;">🕉️</span>

    <!-- Cosmic AI Chat Drawer / Window -->
    <div id="astro-chat-window" class="chat-modal-window">
      <div class="chat-window-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="chat-header-avatar">🕉️</div>

        <button class="chat-chip" onclick="sendQuickPrompt('शनिको साढेसाती भनेको के हो र यसको शान्ति कसरी गरिन्छ?')">🪐 साढेसाती उपाय</button>
        <button class="chat-chip" onclick="sendQuickPrompt('माङ्गलिक दोषको प्रभाव के हुन्छ?')">🔥 माङ्गलिक दोष</button>
        <button class="chat-chip" onclick="sendQuickPrompt('पण्डितजीसँग प्रत्यक्ष परामर्श कसरी लिने?')">📞 परामर्श लिने तरिका</button>
      </div>

      <!-- Messages Body -->
      <div id="chat-messages-body" class="chat-messages-area">

          नमस्ते! म <b>Astro Tiwari AI</b> ज्योतिष सल्लाहकार हुँ।<br />
          तपाईंको जन्म कुण्डली, ग्रहदशा, करियर, विवाह वा पूजा-उपाय सम्बन्धी कुनै पनि जिज्ञासा सोध्न सक्नुहुन्छ।

      <!-- Input Bar -->
      <form id="chat-input-form" class="chat-input-row" onsubmit="handleSendChat(event)">
        <input 
          type="text" 
          id="chat-user-msg" 
          class="chat-input-field" 
          placeholder="कुनै पनि ज्योतिषीय जिज्ञासा लेख्नुहोस्..." 
          autocomplete="off"
          required 
        />

          ➤
        </button>

    <!-- Interactive Scripts: QR Lightbox & Form Submission Capture -->
    <script>
      // Cosmic AI Chatbot Logic
      let isChatOpen = false;
      function toggleAstroChat() {
        const win = document.getElementById('astro-chat-window');
        if (!win) return;
        isChatOpen = !isChatOpen;
        win.style.display = isChatOpen ? 'flex' : 'none';
        if (isChatOpen) {
          const inp = document.getElementById('chat-user-msg');
          if (inp) inp.focus();
        }
      }

      function sendQuickPrompt(text) {
        const inp = document.getElementById('chat-user-msg');
        if (inp) {
          inp.value = text;
          handleSendChat(new Event('submit'));
        }
      }

      async function handleSendChat(e) {
        if (e && e.preventDefault) e.preventDefault();
        const input = document.getElementById('chat-user-msg');
        const body = document.getElementById('chat-messages-body');
        if (!input || !body) return;

        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        // Add user bubble
        const userDiv = document.createElement('div');
        userDiv.className = 'chat-bubble user-bubble';
        userDiv.textContent = text;
        body.appendChild(userDiv);

        // Add loading bot bubble
        const botDiv = document.createElement('div');
        botDiv.className = 'chat-bubble bot-bubble';
        botDiv.innerHTML = '<em>चिन्तन गर्दै... ⏳</em>';
        body.appendChild(botDiv);
        body.scrollTop = body.scrollHeight;

        try {
          const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const json = await res.json();
          if (json && json.success) {
            botDiv.innerHTML = json.response.replace(/\n/g, '<br />');
          } else {
            botDiv.textContent = 'माफ गर्नुहोस्, हाल AI सल्लाहकार सेवा उपलब्ध छैन। कृपया केही समयपछि पुनः प्रयास गर्नुहोस्।';
          }
        } catch (err) {
          botDiv.textContent = 'नेटवर्क त्रुटि भयो। कृपया इन्टरनेट जडान जाँच गर्नुहोस्।';
        }
        body.scrollTop = body.scrollHeight;
      }
      // Move Packages section to top right after Hero
      function placePackagesAtTop() {
        const packages = document.getElementById('packages');
        if (!packages) return;
        const main = document.querySelector('main') || document.querySelector('#root > div');
        if (!main) return;

        const hero = main.querySelector('.cosmic-card')?.closest('section') || main.querySelector('section');
        if (hero && hero !== packages && packages.previousElementSibling !== hero) {
          hero.after(packages);
        }
      }

      // Wire payment amounts and package buttons directly to 3-step checkout
      document.addEventListener('click', function(e) {
        // 1. Check if user clicked on payment amounts pill (Basic रु. २९९, Standard रु. ४९९, VIP रु. १,०५५)
        const amtSpan = e.target.closest('.payment-amounts span');
        if (amtSpan) {
          e.preventDefault();
          e.stopPropagation();
          const parent = amtSpan.parentElement;
          const idx = parent ? Array.from(parent.children).indexOf(amtSpan) : -1;
          const txt = (amtSpan.innerText || '').toLowerCase();
          
          let plan = 'standard';
          if (idx === 0 || txt.includes('basic') || txt.includes('२९९') || txt.includes('299')) {
            plan = 'basic';
          } else if (idx === 2 || txt.includes('vip') || txt.includes('१०५५') || txt.includes('1055') || txt.includes('१,०५५')) {
            plan = 'vip';
          } else {
            plan = 'standard';
          }
          window.location.href = `/pay?plan=${plan}`;
          return;
        }

        // Click on .payment-amounts container directly
        const amtContainer = e.target.closest('.payment-amounts');
        if (amtContainer) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = '/pay?plan=standard';
          return;
        }

        // 2. Check if user clicked on package card button or the package card itself
        const btn = e.target.closest('.package-button, button');
        const card = e.target.closest('.package-card');
        if (btn || card) {
          const el = btn || card;
          const txt = (el.innerText || el.className || '').toLowerCase();
          if (txt.includes('basic') || txt.includes('२९९') || txt.includes('299')) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = '/pay?plan=basic';
            return;
          } else if (txt.includes('vip') || txt.includes('१०५५') || txt.includes('1055') || txt.includes('१,०५५')) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = '/pay?plan=vip';
            return;
          } else if (txt.includes('standard') || txt.includes('४९९') || txt.includes('499')) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = '/pay?plan=standard';
            return;
          }
        }
      }, true);

      const topObserver = new MutationObserver(placePackagesAtTop);
      topObserver.observe(document.body, { childList: true, subtree: true });

      // 1. QR Code Click-to-Zoom Lightbox
      document.addEventListener('click', function(e) {
        const img = e.target.closest('.qr-payment-wrap img, .qr-frame img, img[alt*="eSewa"]');
        if (!img) return;

        let modal = document.getElementById('qr-modal-overlay');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'qr-modal-overlay';
          modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(11,10,20,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity 0.25s ease;cursor:pointer;';
          
          modal.innerHTML = `
            <div style="background:#fff;border-radius:1.5rem;padding:24px 20px 20px;max-width:360px;width:100%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.6);position:relative;transform:scale(0.92);transition:transform 0.25s ease;cursor:default;" onclick="event.stopPropagation()">
              <button id="qr-modal-close" aria-label="Close" style="position:absolute;top:14px;right:14px;background:#f3eef6;border:none;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:#45394d;display:flex;align-items:center;justify-content:center;">&times;</button>
              
              <div style="margin-bottom:12px;">
                <span style="background:#1f8f5a;color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:0.02em;">eSewa Payment QR</span>
              </div>
              
              <img src="${img.src}" alt="eSewa QR Large" style="width:100%;max-width:280px;height:auto;border-radius:0.75rem;display:block;margin:0 auto 14px;box-shadow:0 4px 16px rgba(0,0,0,0.08);"/>
              
              <div style="margin-bottom:14px;">
                <div style="font-size:17px;font-weight:700;color:#221b27;">Ayush Tiwari</div>
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;">
                  <span style="font-size:15px;color:#5a4f61;font-weight:600;letter-spacing:0.5px;">9809192604</span>
                  <button id="copy-esewa-btn" style="background:#f4ecdf;color:#a8794f;border:1px solid #d9be9e;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s ease;">Copy</button>
                </div>
              </div>
              
              <p style="font-size:11.5px;color:#7b6d81;margin:0;line-height:1.5;">
                eSewa app बाट scan गर्नुहोस् वा सिधै eSewa ID मा रकम पठाउनुहोस्।
              </p>
            </div>
          `;
          document.body.appendChild(modal);

          modal.addEventListener('click', function(evt) {
            modal.style.opacity = '0';
            modal.firstElementChild.style.transform = 'scale(0.92)';
            setTimeout(() => modal.remove(), 250);
          });

          modal.querySelector('#qr-modal-close').addEventListener('click', function() {
            modal.style.opacity = '0';
            modal.firstElementChild.style.transform = 'scale(0.92)';
            setTimeout(() => modal.remove(), 250);
          });

          const copyBtn = modal.querySelector('#copy-esewa-btn');
          copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText('9809192604').then(() => {
              copyBtn.textContent = 'Copied! ✓';
              copyBtn.style.background = '#1f8f5a';
              copyBtn.style.color = '#fff';
              setTimeout(() => {
                copyBtn.textContent = 'Copy';
                copyBtn.style.background = '#f4ecdf';
                copyBtn.style.color = '#a8794f';
              }, 2000);
            });
          });
        }

        requestAnimationFrame(() => {
          modal.style.opacity = '1';
          modal.firstElementChild.style.transform = 'scale(1)';
        });
      });

      // 2. Automatically save consultation submissions to Admin Portal
      let latestPaymentBase64 = '';
      let latestKundaliBase64 = '';

      // Track file inputs when selected
      document.addEventListener('change', function(e) {
        if (e.target.type === 'file' && e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = function(evt) {
            const dataUrl = evt.target.result;
            // Identify if payment screenshot or kundali
            const name = (e.target.name || '').toLowerCase();
            const accept = (e.target.accept || '').toLowerCase();
            const form = e.target.closest('form');
            const isPayment = name.includes('payment') || (form && form.innerText.includes('Payment screenshot'));
            
            if (isPayment || e.target.id?.includes('payment') || latestKundaliBase64) {
              latestPaymentBase64 = dataUrl;
            } else {
              latestKundaliBase64 = dataUrl;
            }
          };
          reader.readAsDataURL(file);
        }
      });

      // Intercept booking form submission
      document.addEventListener('submit', function(e) {
        const form = e.target.closest('.booking-form, form');
        if (!form || form.id === 'login-form' || form.classList.contains('boss-code-form')) return;

        const fd = new FormData(form);
        const name = String(fd.get('name') || '').trim();
        const phone = String(fd.get('phone') || '').trim();
        if (!name && !phone) return;

        const payload = {
          name: name,
          phone: phone,
          gender: String(fd.get('gender') || ''),
          dob_bs: String(fd.get('dob_bs') || ''),
          dob_ad: String(fd.get('dob_ad') || ''),
          birth_hour: String(fd.get('birth_hour') || ''),
          birth_minute: String(fd.get('birth_minute') || ''),
          birth_period: String(fd.get('birth_period') || ''),
          birth_place: String(fd.get('birth_place') || ''),
          package: String(fd.get('topic') || 'Standard Package (रु. ४९९)'),
          message: String(fd.get('message') || ''),
          rectification: String(fd.get('rectification') || ''),
          paymentScreenshotBase64: latestPaymentBase64,
          kundaliPhotoBase64: latestKundaliBase64
        };

        fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(res => res.json()).then(res => {
          console.log('[Admin Sync] Consultation saved for admin review:', res.id);
        }).catch(err => {
          console.error('[Admin Sync Error]', err);
        });
      }, true);
    </script>
  </body>
</html>
